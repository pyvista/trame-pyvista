[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=64', 'setuptools_scm>=8']

[project]
authors = [{ name = 'The PyVista Developers', email = 'info@pyvista.org' }]
classifiers = [
  'Development Status :: 4 - Beta',
  'Intended Audience :: Science/Research',
  'Operating System :: MacOS',
  'Operating System :: Microsoft :: Windows',
  'Operating System :: POSIX :: Linux',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Topic :: Scientific/Engineering :: Visualization',
]
dependencies = [ # trame bounds: trame-floor and test CI jobs pass
  'pyvista>=0.48',
  'trame-client>=3.10,<4.1.1',
  'trame-common>=1.2.4,<1.2.8',
  'trame-server>=3.9,<4.0.1',
  'trame-vtk>=2.11.16,<2.11.18',
  'trame-vuetify>=3.2.5,<3.2.7',
  'trame>=3.9.1,<4.0.1',
  'wslink>=2.5,<2.5.8',
]
description = 'Trame interface for PyVista'
dynamic = ['version']
keywords = ['jupyter', 'pyvista', 'trame', 'visualization', 'vtk']
license = 'MIT'
name = 'trame-pyvista'
readme = 'README.md'
requires-python = '>=3.10'

[project.optional-dependencies]
dev = [
  'mypy>=1.10',
  'pre-commit',
  'ruff==0.16.8',
  'trame-pyvista[jupyter,sphinx,test,playwright]',
]
jupyter = ['ipywidgets', 'jupyter-server-proxy', 'nest-asyncio2']
playwright = [
  'matplotlib',
  'numpydoc',
  'playwright',
  'sphinx',
  'sphinx-book-theme',
  'sphinx-design',
  'sphinx-gallery',
]
sphinx = ['docutils', 'sphinx']
test = [
  'ipython',
  'ipywidgets',
  'nest-asyncio2',
  'numpy<2.5', # noisy shape deprecations until VTK 9.7
  'pytest-cov>=5.0',
  'pytest>=8.0',
  'trame-pyvista[sphinx]',
]

[project.urls]
Homepage = 'https://github.com/pyvista/trame-pyvista'
Issues = 'https://github.com/pyvista/trame-pyvista/issues'
Repository = 'https://github.com/pyvista/trame-pyvista'

# Register the trame jupyter backends so PyVista discovers them via entry
# points. PyVista 0.48's entry-point loader skips names that collide with
# its built-in backends (``trame/server/client/html``); loading those
# would never trigger this package's import. The ``trame-pyvista`` alias
# is non-colliding, so PyVista imports ``trame_pyvista`` during entry-point
# discovery — which runs ``trame_pyvista/__init__.py`` and registers the
# four built-in names with ``override=True``.
#
# The colliding entries are kept for the future PyVista release that
# drops its bundled ``pyvista.trame`` shim and stops skipping these
# names; at that point the alias will become redundant but remains
# harmless.
[project.entry-points.'pyvista.jupyter_backends']
client = 'trame_pyvista.jupyter:show_trame'
html = 'trame_pyvista.jupyter:show_trame'
server = 'trame_pyvista.jupyter:show_trame'
trame = 'trame_pyvista.jupyter:show_trame'
trame-pyvista = 'trame_pyvista.jupyter:show_trame'

# Plotter component plugin: importing this module registers the ``trame``
# namespace on ``pyvista.BasePlotter`` (e.g. ``plotter.trame.export_vtksz``).
[project.entry-points.'pyvista.plotter_components']
trame = 'trame_pyvista.components'

[tool.setuptools.packages.find]
include = ['trame*', 'trame_pyvista*']
where = ['.']

[tool.setuptools.package-data]
trame_pyvista = ['py.typed']

[tool.setuptools_scm]
version_scheme = 'release-branch-semver'
write_to = 'trame_pyvista/_version.py'

[tool.ruff]
extend-exclude = [
  'tests/tinypages',
  'trame/widgets/__init__.py', # byte-for-byte upstream trame copy
  'trame_pyvista/_version.py',
]
line-length = 99
src = ['.']

[tool.ruff.format]
docstring-code-format = true
quote-style = 'single'

[tool.ruff.lint]
extend-select = [
  'A',
  'B',
  'C4',
  'D',
  'E',
  'EM',
  'F',
  'FA',
  'I',
  'ICN',
  'N',
  'PERF',
  'PGH',
  'PIE',
  'PT',
  'RET',
  'RSE',
  'RUF',
  'SIM',
  'T10',
  'T20',
  'TCH',
  'TID',
  'UP',
  'W',
  'YTT',
]
ignore = [
  'D107', # Missing docstring in __init__
  'D203', # one-blank-line-before-class
  'D213', # multi-line-summary-second-line
  'SIM117', # Trame UI builders rely on nested `with` blocks for layout
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = true
force-sort-within-sections = true
known-first-party = ['trame_pyvista']
known-third-party = ['trame']
required-imports = ['from __future__ import annotations']

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['E402', 'F401', 'PLC0414']
'examples/**' = ['D', 'E501', 'INP001', 'T20']
'tests/**' = ['B018', 'D', 'INP001', 'S101', 'T20']
'trame/widgets/__init__.py' = ['D104', 'I002', 'Q000']
'trame_pyvista/jupyter.py' = ['B904']
'trame_pyvista/ui/**' = ['D101', 'D102', 'D103', 'E501']

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.pytest.ini_options]
addopts = '-ra --tb=short'
filterwarnings = [
  'error',
  'ignore::ResourceWarning',
  'ignore:Call to deprecated method.*:DeprecationWarning',
  'ignore:It is recommended to use web\.AppKey instances.*:',
]
markers = ['needs_playwright: requires playwright (run with --playwright)']
testpaths = ['tests']

[tool.coverage.run]
branch = true
source = ['trame_pyvista']

[tool.coverage.report]
exclude_lines = [
  'if TYPE_CHECKING:',
  'pragma: no cover',
  'raise NotImplementedError',
]

[tool.mypy]
disable_error_code = ['import-untyped']
files = ['trame_pyvista']
ignore_missing_imports = true
python_version = '3.10'

[[tool.mypy.overrides]]
follow_imports = 'skip'
ignore_errors = true
module = ['docutils.*', 'sphinx.*', 'trame.widgets.*']
