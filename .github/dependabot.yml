version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      # Weekly so trame-vtk / trame-* regressions surface in a bump PR
      # shortly after a release lands, instead of waiting up to a month.
      interval: weekly
    labels: [maintenance, dependencies]
    open-pull-requests-limit: 20
  - package-ecosystem: github-actions
    directory: "/.github/workflows"
    schedule:
      interval: weekly
    labels: [maintenance, dependencies]
    groups:
      artifacts:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
