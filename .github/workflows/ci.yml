name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC: runs `trame-latest` against that week's releases.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy trame_pyvista

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pyvista/setup-headless-display-action@v5
        with:
          pyvista: true
      - run: uv sync --extra test --python ${{ matrix.python-version }}
      - run: uv run pytest tests/ --cov --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pyvista/setup-headless-display-action@v5
        with:
          pyvista: true
      - run: uv sync --extra test --extra playwright --extra sphinx
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/ --playwright -m needs_playwright

  # Run the suite with every trame dependency at its declared minimum.
  trame-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pyvista/setup-headless-display-action@v4
        with:
          pyvista: true
      - run: uv sync --extra test --extra playwright --extra sphinx
      - run: uv pip install $(uv run python .github/scripts/trame_floors.py)
      - run: uv pip list | grep -iE '^(vtk|trame|wslink)'
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/ --playwright

  # Run the suite against the newest trame ecosystem releases that can coexist,
  # ignoring our upper pins, so a breakage is known before dependabot proposes the
  # bump. Synced versions become lower bounds so nothing is downgraded to fit.
  trame-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pyvista/setup-headless-display-action@v5
        with:
          pyvista: true
      - run: uv sync --extra test --extra playwright --extra sphinx
      - run: uv pip freeze | grep -iE '^(trame|wslink)' | sed 's/==/>=/' > floors.txt
      - run: uv pip install --upgrade --constraint floors.txt trame trame-client trame-common trame-server trame-vtk trame-vuetify wslink
      - run: uv pip list | grep -iE '^(vtk|trame|wslink)'
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/ --playwright

  build:
    needs: [lint, test, trame-floor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
